<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>CS Trim promo</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html,body{margin:0;background:#000}
#stage{position:relative;overflow:hidden;-webkit-font-smoothing:antialiased;font-family:'Noto Sans Hebrew',sans-serif}
#scenes{position:absolute;left:0;top:0;width:100%;height:100%}
.scene{position:absolute;left:0;top:0;overflow:hidden;display:none}
.a{position:absolute;left:0;top:0}
.g{position:absolute;width:0;height:0;transform-origin:0 0}
.tx{position:absolute;left:0;top:0;white-space:nowrap}
svg{overflow:visible;display:block}
</style>
<script>
// Project settings. render.py and audio.py read them from here, so this is the only place they live.
window.CONFIG = {
  W: 1920, H: 1080,     // built at 1920x1080, rendered with SCALE=2 for 3840x2160 (4K wide)
  DUR: 30,             // the story is timed in story seconds (scene.js) and plays 1.4x slower
  FPS: 60,
  bg: '#0A0A0F',
  palette: {            // the approved colours
    INK: '#0A0A0F', INK2: '#14141C', WHITE: '#F5F5F7', GREY: '#8E8E9A',
    VIOLET: '#7C5CFF', BLUE: '#4F8EF7', LOGO1: '#5A9DFF', LOGO2: '#1A5BE6',
    WARM: '#F97316',    // the one warm accent: the plugin's orange highlight swatch (silences, marker, key words)
    // CS Trim panel tokens (css/style.css of the plugin)
    PN_BG: '#191919', PN_S1: '#212121', PN_S2: '#282828', PN_S3: '#303030', PN_LINE: '#2C2C2C', PN_LINE2: '#3A3A3A',
    PN_TX: '#ECECEC', PN_TX2: '#A3A3A3', PN_TX3: '#6F6F6F', ACC: '#3B78F0', ACC_H: '#4C86F5', ACC_T: '#8DB3FF', OK: '#3FB950',
  },
  loop: false,
  hold: 2.9,            // the end card holds from about 27 s (the comment line)
  bpm: 120, beat0: 0,
  music: { file: 'vo_30.wav', start: 0, gain: 0 },   // the voice-over: vo2.mp3 cut into its 12 lines, each placed on its scene (vo_lines.json)
  snap: false,          // keep the sound cues where the picture puts them (do not snap them onto the voice)
};
</script>
</head>
<body>
<div id="stage"><div id="scenes"></div></div>
<script src="core.js"></script>
<script src="panel.js"></script>
<script src="scene.js"></script>
</body>
</html>
